<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Layanan - RSUD Tugu Koja</title>
    <meta name="description" content="Daftar lengkap layanan kesehatan RSUD Tugu Koja meliputi poliklinik spesialis, rawat inap, laboratorium, radiologi, dan farmasi." />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=Atkinson+Hyperlegible+Next:wght@400;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script src="assets/js/tailwind-config.js"></script>
    <style>
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }

      /* Card hover lift & glow */
      .layanan-card {
        transition: transform 0.35s cubic-bezier(.22,.68,0,1.2), box-shadow 0.35s ease;
      }
      .layanan-card:hover {
        transform: translateY(-8px) scale(1.02);
        box-shadow: 0 20px 40px rgba(34,66,102,0.12), 0 4px 12px rgba(52,145,140,0.10);
      }
      .layanan-card:hover .card-img {
        transform: scale(1.08);
      }
      .layanan-card:hover .card-overlay {
        opacity: 1;
      }
      .layanan-card:hover .card-arrow {
        opacity: 1;
        transform: translateX(0);
      }

      .card-img {
        transition: transform 0.5s cubic-bezier(.22,.68,0,1.2);
      }
      .card-overlay {
        opacity: 0;
        transition: opacity 0.35s ease;
      }
      .card-arrow {
        opacity: 0;
        transform: translateX(-8px);
        transition: all 0.3s ease 0.1s;
      }

      /* Pagination button styles */
      .page-btn {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 600;
        font-size: 14px;
        transition: all 0.25s ease;
        cursor: pointer;
        border: 1.5px solid #e2e8f0;
        color: #43474e;
        background: white;
      }
      .page-btn:hover:not(.active):not(:disabled) {
        background: #f2f4f6;
        border-color: #34918C;
        color: #34918C;
      }
      .page-btn.active {
        background: linear-gradient(135deg, #224266, #1a3550);
        color: white;
        border-color: #224266;
        box-shadow: 0 4px 12px rgba(34,66,102,0.3);
      }
      .page-btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .page-btn-nav {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.25s ease;
        cursor: pointer;
        border: 1.5px solid #e2e8f0;
        color: #224266;
        background: white;
      }
      .page-btn-nav:hover:not(:disabled) {
        background: #224266;
        color: white;
        border-color: #224266;
      }
      .page-btn-nav:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      /* Fade in animation for cards */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(24px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .card-animate {
        animation: fadeInUp 0.45s ease forwards;
      }
    </style>
  </head>

  <body class="bg-surface text-on-surface font-body-md">
    <div id="navbar-container" style="height: 36px;"></div>
    <main>
      <!-- Hero Section -->
      <section class="relative h-[280px] md:h-[360px] w-full overflow-hidden flex items-end">
        <div class="absolute inset-0 z-0">
          <img
            alt="RSUD Tugu Koja Hospital Building"
            class="w-full h-full object-cover"
            src="assets/images/hero/RS%20Tugu%20Koja.jpg"
          />
          <div class="absolute inset-0 bg-gradient-to-t from-jakarta-blue/90 via-jakarta-blue/50 to-jakarta-blue/20"></div>
        </div>
        <div class="relative z-10 max-w-container-max mx-auto px-gutter w-full pb-12">
          <!-- Breadcrumb inside hero -->
          <nav class="mb-4" aria-label="Breadcrumb">
            <ol class="flex items-center gap-2 text-sm text-white/70 font-label-md">
              <li><a href="index.html" class="hover:text-white transition-colors" style="text-decoration:none;">Beranda</a></li>
              <li><span class="material-symbols-outlined text-[14px]">chevron_right</span></li>
              <li class="text-white font-semibold">Layanan</li>
            </ol>
          </nav>
          <div class="max-w-2xl">
            <h1 class="font-headline-xl text-headline-xl text-white mb-2" style="text-shadow: 0 2px 8px rgba(0,0,0,0.15);">
              Layanan Kami
            </h1>
            <p class="font-body-md text-[16px] text-white/80 mb-6">
              Jelajahi berbagai layanan kesehatan lengkap yang tersedia di RSUD Tugu Koja,
              dari poliklinik spesialis hingga fasilitas penunjang medis.
            </p>
          </div>
        </div>
      </section>

      <!-- Layanan Cards Section -->
      <section class="py-16 md:py-20 max-w-container-max mx-auto px-gutter">

        <!-- Cards Grid -->
        <div id="layanan-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8 min-h-[520px]">
          <!-- Cards populated by JS -->
        </div>

        <!-- Pagination -->
        <div class="flex items-center justify-center gap-2 mt-12" id="pagination-container">
          <!-- Pagination populated by JS -->
        </div>
      </section>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>

    <script>
      // ========================================
      // LAYANAN DATA
      // ========================================
      const layananData = [
        {
          nama: "Poli Kebidanan & Kandungan",
          gambar: "assets/images/layanan/card_polikandungan.webp",
          link: "caridokter.html"
        },
        {
          nama: "Poli Penyakit Dalam",
          gambar: "assets/images/layanan/poli_forall.webp",
          link: "caridokter.html"
        },
        {
          nama: "Poli Anak",
          gambar: "assets/images/layanan/poli_forall.webp",
          link: "caridokter.html"
        },
        {
          nama: "Poli Mata",
          gambar: "assets/images/layanan/card_polimata.webp",
          link: "caridokter.html"
        },
        {
          nama: "Poli Paru",
          gambar: "assets/images/layanan/poli_forall.webp",
          link: "caridokter.html"
        },
        {
          nama: "Poli Kulit & Kelamin",
          gambar: "assets/images/layanan/poli_forall.webp",
          link: "caridokter.html"
        },
        {
          nama: "Poli THT-KL",
          gambar: "assets/images/layanan/poli_forall.webp",
          link: "caridokter.html"
        },
        {
          nama: "Poli Bedah Umum",
          gambar: "assets/images/layanan/poli_forall.webp",
          link: "caridokter.html"
        },
        {
          nama: "Poli Saraf",
          gambar: "assets/images/layanan/poli_forall.webp",
          link: "caridokter.html"
        },
        {
          nama: "Poli Jantung & Pembuluh Darah",
          gambar: "assets/images/layanan/poli_forall.webp",
          link: "caridokter.html"
        },
        {
          nama: "Poli Rehab Medik",
          gambar: "assets/images/layanan/poli_forall.webp",
          link: "caridokter.html"
        },
        {
          nama: "Poli Konservasi Gigi",
          gambar: "assets/images/layanan/poli_forall.webp",
          link: "caridokter.html"
        },
        {
          nama: "Poli Gigi Umum",
          gambar: "assets/images/layanan/poli_forall.webp",
          link: "caridokter.html"
        },
        {
          nama: "Poli Akupunktur",
          gambar: "assets/images/layanan/poli_forall.webp",
          link: "caridokter.html"
        },
        {
          nama: "Klinik Gizi",
          gambar: "assets/images/layanan/poli_forall.webp",
          link: "klinik-detail.html?id=klinik-gizi"
        },
        {
          nama: "Klinik MCU",
          gambar: "assets/images/layanan/poli_forall.webp",
          link: "klinik-detail.html?id=klinik-mcu"
        },
        {
          nama: "Klinik Geriatri",
          gambar: "assets/images/layanan/poli_forall.webp",
          link: "klinik-detail.html?id=klinik-geriatri"
        },
        {
          nama: "Klinik Sehati",
          gambar: "assets/images/layanan/poli_forall.webp",
          link: "klinik-detail.html?id=klinik-sehati"
        },
        {
          nama: "Rawat Inap",
          gambar: "assets/images/layanan/rawat inap.png",
          link: "layanan/rawat-inap.html"
        },
        {
          nama: "Laboratorium",
          gambar: "assets/images/layanan/poli_forall.webp",
          link: "layanan/laboratorium.html"
        },
        {
          nama: "Radiologi",
          gambar: "assets/images/layanan/poli_forall.webp",
          link: "layanan/radiologi.html"
        },
        {
          nama: "Farmasi",
          gambar: "assets/images/layanan/poli_forall.webp",
          link: "layanan.html"
        }
      ];

      // ========================================
      // PAGINATION LOGIC
      // ========================================
      const ITEMS_PER_PAGE = 6;
      let currentPage = 1;
      const totalPages = Math.ceil(layananData.length / ITEMS_PER_PAGE);

      function renderCards(page) {
        const grid = document.getElementById('layanan-grid');
        const start = (page - 1) * ITEMS_PER_PAGE;
        const end = start + ITEMS_PER_PAGE;
        const pageData = layananData.slice(start, end);

        grid.innerHTML = pageData.map((item, index) => `
          <a href="${item.link}" class="layanan-card block rounded-2xl overflow-hidden bg-white border border-surface-subtle shadow-sm card-animate" style="animation-delay: ${index * 0.08}s; text-decoration: none;">
            <div class="relative h-52 md:h-56 overflow-hidden">
              <img
                src="${item.gambar}"
                alt="${item.nama}"
                class="card-img w-full h-full object-cover"
                loading="lazy"
              />
              <!-- Hover overlay -->
              <div class="card-overlay absolute inset-0 bg-gradient-to-t from-jakarta-blue/70 via-jakarta-blue/20 to-transparent flex items-end justify-between p-5">
                <span class="text-white font-label-md text-sm">Lihat Detail</span>
                <div class="card-arrow w-9 h-9 rounded-full bg-white/90 flex items-center justify-center">
                  <span class="material-symbols-outlined text-jakarta-blue text-[18px]">arrow_forward</span>
                </div>
              </div>
            </div>
            <div class="p-5">
              <h3 class="font-headline-md text-[17px] md:text-[18px] text-jakarta-blue font-semibold leading-snug">${item.nama}</h3>
            </div>
          </a>
        `).join('');

        // Scroll to top of section smoothly
        if (page !== 1 || document.scrollingElement.scrollTop > 400) {
          document.getElementById('layanan-grid').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }

      function renderPagination(page) {
        const container = document.getElementById('pagination-container');
        let html = '';

        // Previous button
        html += `<button class="page-btn-nav" onclick="goToPage(${page - 1})" ${page === 1 ? 'disabled' : ''} aria-label="Halaman Sebelumnya">
          <span class="material-symbols-outlined text-[20px]">chevron_left</span>
        </button>`;

        // Page numbers
        for (let i = 1; i <= totalPages; i++) {
          if (totalPages <= 7 || Math.abs(i - page) <= 1 || i === 1 || i === totalPages) {
            html += `<button class="page-btn ${i === page ? 'active' : ''}" onclick="goToPage(${i})" aria-label="Halaman ${i}">${i}</button>`;
          } else if (
            (i === page - 2 && page > 3) ||
            (i === page + 2 && page < totalPages - 2)
          ) {
            html += `<span class="px-1 text-text-muted text-sm select-none">…</span>`;
          }
        }

        // Next button
        html += `<button class="page-btn-nav" onclick="goToPage(${page + 1})" ${page === totalPages ? 'disabled' : ''} aria-label="Halaman Berikutnya">
          <span class="material-symbols-outlined text-[20px]">chevron_right</span>
        </button>`;

        container.innerHTML = html;
      }

      function goToPage(page) {
        if (page < 1 || page > totalPages) return;
        currentPage = page;
        renderCards(page);
        renderPagination(page);
      }

      // Initial render
      renderCards(1);
      renderPagination(1);
    </script>

    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
  </body>
</html>
