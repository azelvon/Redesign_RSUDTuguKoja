<!DOCTYPE html>
<html class="light" lang="id">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Detail Berita - RSUD Tugu Koja</title>
    <meta name="description" content="Detail berita dari RSUD Tugu Koja Jakarta Utara.">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Atkinson+Hyperlegible+Next:wght@400;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script src="assets/js/tailwind-config.js"></script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        body {
            font-family: 'Atkinson Hyperlegible Next', sans-serif;
            background-color: #f7f9fb;
        }

        /* Skeleton loading */
        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }

        .skeleton {
            background: linear-gradient(90deg, #e6e8ea 25%, #f2f4f6 50%, #e6e8ea 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
            border-radius: 8px;
        }

        .article-content {
            line-height: 1.8;
        }

        .article-content p {
            margin-bottom: 1.25rem;
        }

        .article-content h3 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            color: #224266;
        }

        .article-content ul,
        .article-content ol {
            margin-left: 1.5rem;
            margin-bottom: 1.25rem;
            padding-left: 1.5rem;
        }

        .article-content ul {
            list-style-type: disc;
        }

        .article-content ol {
            list-style-type: decimal;
        }

        .article-content li {
            margin-bottom: 0.5rem;
            margin-left: 0.5rem;
        }

        /* Related articles grid */
        .related-card {
            transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.28s ease;
            cursor: pointer;
        }

        .related-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px -8px rgba(34, 66, 102, 0.12);
        }

        /* Fade-in animation */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeInUp 0.4s ease-out both;
        }
    </style>
</head>

<body class="bg-surface text-on-surface font-body-md">
    <div id="navbar-container" style="height: 36px;"></div>

    <main class="min-h-screen">
        <!-- Hero Section -->
        <section class="relative h-[280px] md:h-[360px] w-full overflow-hidden flex items-end mb-12">
            <div class="absolute inset-0 z-0">
                <img
                    alt="RSUD Tugu Koja Hospital Building"
                    class="w-full h-full object-cover"
                    src="assets/images/hero/RS%20Tugu%20Koja.jpg"
                />
                <div class="absolute inset-0 bg-gradient-to-t from-jakarta-blue/90 via-jakarta-blue/50 to-jakarta-blue/20"></div>
            </div>
            <div class="relative z-10 max-w-container-max mx-auto px-gutter w-full pb-12">
                <nav class="mb-4" aria-label="Breadcrumb">
                    <ol class="flex items-center gap-2 text-sm text-white/70 font-label-md flex-wrap">
                        <li><a href="index.html" class="hover:text-white transition-colors" style="text-decoration:none;">Beranda</a></li>
                        <li><span class="material-symbols-outlined text-[14px]">chevron_right</span></li>
                        <li><a href="berita.html" class="hover:text-white transition-colors" style="text-decoration:none;">Berita</a></li>
                        <li><span class="material-symbols-outlined text-[14px]">chevron_right</span></li>
                        <li id="breadcrumb-title" class="text-white font-semibold line-clamp-1">Detail Berita</li>
                    </ol>
                </nav>
                <div class="max-w-2xl">
                    <h1 id="hero-title" class="font-headline-xl text-headline-xl text-white mb-2" style="text-shadow: 0 2px 8px rgba(0,0,0,0.15);">
                        Detail Berita
                    </h1>
                    <p id="hero-summary" class="font-body-md text-[16px] text-white/80 max-w-xl">
                        Informasi lengkap seputar berita dan artikel dari RSUD Tugu Koja.
                    </p>
                </div>
            </div>
        </section>

        <!-- Article Content -->
        <section class="max-w-container-max mx-auto px-gutter py-12">
            <article class="max-w-3xl mx-auto">
                <!-- Featured Image -->
                <div id="featured-image" class="relative w-full h-96 rounded-2xl overflow-hidden mb-8 skeleton">
                    <img alt="Featured" class="w-full h-full object-cover" id="article-image">
                    <span id="category-badge" class="absolute top-4 left-4 px-3 py-1.5 bg-jakarta-blue text-white rounded-full font-label-md text-[12px] tracking-wide uppercase"></span>
                </div>

                <!-- Header -->
                <div class="mb-8">
                    <div class="flex items-center gap-2 text-text-muted font-label-md text-[13px] mb-4 flex-wrap">
                        <span class="flex items-center gap-1.5">
                            <span class="material-symbols-outlined text-[16px]">calendar_today</span>
                            <time id="article-date"></time>
                        </span>
                        <span class="w-1 h-1 bg-outline-variant rounded-full"></span>
                        <span id="article-author"></span>
                    </div>
                    <h1 id="article-title" class="font-headline-lg text-[32px] lg:text-[40px] leading-tight text-jakarta-blue mb-4"></h1>
                    <p id="article-summary" class="font-body-lg text-[16px] text-on-surface-variant leading-relaxed"></p>
                </div>

                <!-- Divider -->
                <div class="h-px bg-outline-variant my-8"></div>

                <!-- Article Body -->
                <div id="article-body" class="article-content text-[16px] text-on-surface leading-relaxed mb-12">
                    <!-- Content akan diisi oleh JavaScript -->
                </div>

                <!-- Share Section -->
                <div class="border-t border-outline-variant pt-8 mt-8">
                    <h3 class="font-headline-md text-[18px] text-jakarta-blue mb-4">Bagikan Berita</h3>
                    <div class="flex gap-4">
                        <button onclick="shareToWhatsApp()" class="flex items-center gap-2 px-4 py-2 rounded-lg bg-green-50 text-green-700 hover:bg-green-100 transition-colors">
                            <span class="material-symbols-outlined">share</span>
                            WhatsApp
                        </button>
                        <button onclick="shareToFacebook()" class="flex items-center gap-2 px-4 py-2 rounded-lg bg-blue-50 text-blue-700 hover:bg-blue-100 transition-colors">
                            <span class="material-symbols-outlined">share</span>
                            Facebook
                        </button>
                        <button onclick="copyLink()" class="flex items-center gap-2 px-4 py-2 rounded-lg bg-gray-50 text-gray-700 hover:bg-gray-100 transition-colors">
                            <span class="material-symbols-outlined">link</span>
                            Salin Link
                        </button>
                    </div>
                </div>

                <!-- Related Articles -->
                <div class="border-t border-outline-variant pt-12 mt-12">
                    <h2 class="font-headline-lg text-[24px] text-jakarta-blue mb-6">Berita Terkait</h2>
                    <div id="related-articles" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Related articles akan diisi oleh JavaScript -->
                    </div>
                </div>
            </article>
        </section>
    </main>

    <div id="footer-container"></div>

    <script>
        const BULAN = [
            'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
            'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
        ];

        let allBerita = [];
        let currentBerita = null;

        // Format tanggal
        function formatTanggal(dateStr) {
            const d = new Date(dateStr);
            return `${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`;
        }

        // Dapatkan ID berita dari URL
        function getBeritaId() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id') || 'berita-001';
        }

        // Load berita.json
        async function loadBerita() {
            try {
                const response = await fetch('assets/data/berita.json');
                if (!response.ok) throw new Error('Fetch gagal');
                allBerita = await response.json();
                displayBerita();
                displayRelatedArticles();
            } catch (err) {
                console.warn('Gagal memuat berita.json:', err.message);
                displayBerita(FALLBACK_BERITA);
                displayRelatedArticles(FALLBACK_BERITA);
            }
        }

        // Tampilkan detail berita
        function displayBerita(fallbackData = []) {
            const beritaId = getBeritaId();
            const dataSource = allBerita.length > 0 ? allBerita : fallbackData;
            currentBerita = dataSource.find(b => b.id === beritaId);

            if (!currentBerita) {
                document.getElementById('article-body').innerHTML = '<p class="text-red-600">Berita tidak ditemukan.</p>';
                return;
            }

            // Update meta data
            document.title = currentBerita.judul + ' - RSUD Tugu Koja';
            document.getElementById('breadcrumb-title').textContent = currentBerita.judul;
            document.getElementById('hero-title').textContent = currentBerita.judul;
            document.getElementById('hero-summary').textContent = currentBerita.ringkasan;
            document.getElementById('article-title').textContent = currentBerita.judul;
            document.getElementById('article-summary').textContent = currentBerita.ringkasan;
            document.getElementById('article-date').textContent = formatTanggal(currentBerita.tanggal);
            document.getElementById('article-author').textContent = currentBerita.penulis || 'Humas RSUD Tugu Koja';
            document.getElementById('category-badge').textContent = currentBerita.kategori;
            document.getElementById('article-image').src = currentBerita.gambar;
            document.getElementById('article-image').onerror = function () {
                this.src = 'assets/images/berita/1.png';
            };

            // Generate article body dengan konten dinamis
            document.getElementById('article-body').innerHTML = generateArticleContent(currentBerita);

            // Hapus skeleton loading
            document.getElementById('featured-image').classList.remove('skeleton');
        }

        // Generate konten artikel berdasarkan berita ID
        function generateArticleContent(berita) {
            const contentMap = {
                'berita-010': `
                    <p>Program screening kesehatan gratis merupakan inisiatif RSUD Tugu Koja untuk meningkatkan kesadaran masyarakat terhadap pentingnya deteksi dini penyakit kronis. Program ini diadakan secara berkala di berbagai wilayah Jakarta Utara.</p>
                    
                    <h3>Tujuan Program</h3>
                    <p>Program screening kesehatan dirancang untuk:</p>
                    <ul>
                        <li>Mendeteksi dini berbagai penyakit kronis seperti hipertensi, diabetes, dan penyakit jantung</li>
                        <li>Meningkatkan kesadaran kesehatan masyarakat</li>
                        <li>Memberikan edukasi tentang gaya hidup sehat</li>
                        <li>Memfasilitasi rujukan ke layanan kesehatan yang lebih lanjut jika diperlukan</li>
                    </ul>

                    <h3>Jenis Pemeriksaan</h3>
                    <p>Pemeriksaan kesehatan gratis mencakup:</p>
                    <ul>
                        <li>Pemeriksaan tekanan darah</li>
                        <li>Pemeriksaan kadar gula darah</li>
                        <li>Pemeriksaan kolesterol</li>
                        <li>Pemeriksaan kesehatan mata</li>
                        <li>Pemeriksaan kesehatan gigi dan mulut</li>
                        <li>Konsultasi dengan tenaga kesehatan profesional</li>
                    </ul>

                    <h3>Manfaat Mengikuti Program</h3>
                    <p>Dengan mengikuti program screening kesehatan gratis, Anda dapat memperoleh manfaat seperti:</p>
                    <ul>
                        <li>Deteksi dini penyakit sebelum gejala muncul</li>
                        <li>Edukasi kesehatan dari tenaga medis profesional</li>
                        <li>Layanan kesehatan berkualitas tanpa biaya</li>
                        <li>Pencegahan penyakit dan komplikasi lebih lanjut</li>
                    </ul>

                    <p>Untuk informasi lebih lanjut tentang jadwal dan lokasi program screening kesehatan, silakan menghubungi bagian Humas RSUD Tugu Koja atau kunjungi website resmi kami.</p>
                `,
                'berita-011': `
                    <p>RSUD Tugu Koja dengan bangga mengumumkan pembukaan layanan konsultasi kesehatan mental yang komprehensif. Layanan ini dirancang untuk memenuhi kebutuhan kesehatan psikologis dan emosional masyarakat Jakarta Utara dengan pendekatan profesional dan penuh empati.</p>
                    
                    <h3>Pentingnya Kesehatan Mental</h3>
                    <p>Kesehatan mental sama pentingnya dengan kesehatan fisik. Stres, kecemasan, depresi, dan gangguan emosional lainnya dapat mempengaruhi kualitas hidup dan produktivitas. Dengan membuka layanan konsultasi kesehatan mental, RSUD Tugu Koja berkomitmen untuk mendukung kesejahteraan psikologis masyarakat.</p>
                    
                    <h3>Layanan yang Ditawarkan</h3>
                    <p>Layanan konsultasi kesehatan mental RSUD Tugu Koja mencakup:</p>
                    <ul>
                        <li>Konsultasi dengan psikolog profesional dan berpengalaman</li>
                        <li>Layanan terapi individu dan keluarga</li>
                        <li>Psikoedukasi tentang kesehatan mental</li>
                        <li>Penanganan stress dan kecemasan</li>
                        <li>Dukungan untuk gangguan mood dan emosional</li>
                        <li>Referral ke spesialis psikiatri jika diperlukan</li>
                    </ul>

                    <h3>Tim Profesional</h3>
                    <p>Layanan ini didukung oleh tim profesional berpengalaman di bidang kesehatan mental, termasuk psikolog klinis, konselor, dan spesialis psikiatri. Semua staf telah terlatih dalam memberikan pelayanan dengan standar internasional dan etika profesional yang tinggi.</p>

                    <h3>Bagaimana Cara Mengakses Layanan</h3>
                    <p>Untuk mengakses layanan konsultasi kesehatan mental, Anda dapat:</p>
                    <ul>
                        <li>Menghubungi bagian pendaftaran RSUD Tugu Koja</li>
                        <li>Membuat janji temu melalui aplikasi kesehatan resmi kami</li>
                        <li>Datang langsung ke ruang konsultasi kesehatan mental</li>
                        <li>Meminta rujukan dari dokter praktik Anda</li>
                    </ul>

                    <h3>Komitmen Kami</h3>
                    <p>RSUD Tugu Koja berkomitmen untuk menyediakan layanan kesehatan mental yang berkualitas, terjangkau, dan dapat diakses oleh semua lapisan masyarakat. Kami percaya bahwa kesehatan mental adalah hak fundamental setiap individu dan merupakan bagian integral dari kesehatan holistik.</p>

                    <p>Jangan ragu untuk mencari bantuan jika Anda atau orang terdekat membutuhkan dukungan kesehatan mental. Tim kami siap membantu Anda dalam perjalanan menuju kesejahteraan psikologis yang lebih baik.</p>
                `
            };

            return contentMap[berita.id] || `<p>${berita.ringkasan}</p>`;
        }

        // Tampilkan artikel terkait
        function displayRelatedArticles(fallbackData = []) {
            const dataSource = allBerita.length > 0 ? allBerita : fallbackData;

            if (!currentBerita) return;

            // Filter artikel terkait (sama kategori, bukan artikel saat ini)
            const related = dataSource
                .filter(b => b.id !== currentBerita.id && b.kategori === currentBerita.kategori)
                .slice(0, 4);

            const container = document.getElementById('related-articles');
            container.innerHTML = related.map(article => `
                <div class="related-card bg-white rounded-2xl overflow-hidden border border-surface-subtle cursor-pointer animate-fade-in" onclick="window.location.href='berita-detail.html?id=${article.id}'">
                    <div class="relative h-40 overflow-hidden">
                        <img
                            alt="${article.judul}"
                            class="w-full h-full object-cover"
                            src="${article.gambar}"
                            onerror="this.src='assets/images/berita/1.png'"
                        >
                    </div>
                    <div class="p-4">
                        <p class="font-body-md text-[13px] text-text-muted mb-2 line-clamp-1">${formatTanggal(article.tanggal)}</p>
                        <h4 class="font-headline-md text-[14px] text-jakarta-blue mb-2 line-clamp-2">${article.judul}</h4>
                        <p class="font-body-md text-[13px] text-text-muted line-clamp-2">${article.ringkasan}</p>
                    </div>
                </div>
            `).join('');
        }

        // Share functions
        function shareToWhatsApp() {
            const title = currentBerita?.judul || 'Berita RSUD Tugu Koja';
            const url = window.location.href;
            const message = `Baca berita: "${title}" ${url}`;
            window.open(`https://wa.me/?text=${encodeURIComponent(message)}`, '_blank');
        }

        function shareToFacebook() {
            const url = window.location.href;
            window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`, '_blank');
        }

        function copyLink() {
            const url = window.location.href;
            navigator.clipboard.writeText(url).then(() => {
                alert('Link berhasil disalin!');
            }).catch(() => {
                alert('Gagal menyalin link');
            });
        }

        // Fallback data
        const FALLBACK_BERITA = [
            {
                "id": "berita-010",
                "judul": "Program Screening Kesehatan Gratis untuk Warga Jakarta Utara",
                "kategori": "Info Kesehatan",
                "tanggal": "2024-07-15",
                "ringkasan": "RSUD Tugu Koja mengadakan program pemeriksaan kesehatan gratis untuk mendeteksi dini berbagai penyakit kronis dan meningkatkan kesadaran kesehatan masyarakat.",
                "gambar": "assets/images/berita/13.jpg",
                "penulis": "Humas RSUD Tugu Koja"
            },
            {
                "id": "berita-011",
                "judul": "Pembukaan Ruang Konsultasi Kesehatan Mental RSUD Tugu Koja",
                "kategori": "Info Layanan",
                "tanggal": "2024-06-08",
                "ringkasan": "RSUD Tugu Koja meluncurkan layanan konsultasi kesehatan mental untuk mendukung kesejahteraan psikologis masyarakat Jakarta Utara dengan tenaga profesional berpengalaman.",
                "gambar": "assets/images/berita/14.jpg",
                "penulis": "Humas RSUD Tugu Koja"
            }
        ];

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            loadBerita();
        });
    </script>

    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
</body>

</html>
